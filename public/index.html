<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumix Image Uploader — Agent</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --line: #262b35;
        --text: #e6e8ec;
        --muted: #8a93a3;
        --ok: #3fb950;
        --warn: #d29922;
        --err: #f85149;
        --accent: #4493f8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 { font-size: 18px; margin: 0; font-weight: 600; }
      .tag { color: var(--muted); font-size: 13px; }
      main { max-width: 880px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px 20px;
      }
      .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .spacer { flex: 1; }
      .badge {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: 13px;
        background: #21262d; color: var(--muted);
      }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
      .badge.connected { color: var(--ok); } .badge.connected .dot { background: var(--ok); }
      .badge.connecting { color: var(--warn); } .badge.connecting .dot { background: var(--warn); }
      .badge.error { color: var(--err); } .badge.error .dot { background: var(--err); }
      button {
        font: inherit; font-weight: 600; cursor: pointer;
        border: 1px solid var(--line); border-radius: 8px;
        padding: 8px 16px; background: #21262d; color: var(--text);
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #04101f; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-top: 4px; }
      .stat { background: #11141a; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
      .stat .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
      .stat .v { font-size: 20px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
      h2 { font-size: 14px; color: var(--muted); margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.05em; }
      select {
        font: inherit; background: #21262d; color: var(--text);
        border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
      }
      .muted { color: var(--muted); font-size: 13px; }
      #gallery {
        display: grid; gap: 12px; margin-top: 14px;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
      .card {
        background: #11141a; border: 1px solid var(--line);
        border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;
      }
      .card .thumb {
        aspect-ratio: 3 / 2; background: #0b0d11 center/contain no-repeat;
        display: flex; align-items: center; justify-content: center;
      }
      .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .card .thumb.empty::after { content: "no preview"; color: var(--muted); font-size: 12px; }
      .card-meta { padding: 8px 10px; display: flex; align-items: center; gap: 6px; }
      .card-meta .name {
        font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .b { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.03em; }
      .b.raw { background: #3a2a12; color: var(--warn); }
      .b.jpg { background: #11324a; color: var(--accent); }
      .card-actions { display: flex; border-top: 1px solid var(--line); }
      .card-actions a {
        flex: 1; text-align: center; padding: 7px 0; font-size: 12px; font-weight: 600;
        color: var(--accent); text-decoration: none;
      }
      .card-actions a + a { border-left: 1px solid var(--line); }
      #log {
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #0b0d11; border: 1px solid var(--line); border-radius: 8px;
        padding: 12px 14px; height: 260px; overflow-y: auto; white-space: pre-wrap;
      }
      .log-line { display: flex; gap: 10px; }
      .log-time { color: var(--muted); flex-shrink: 0; }
      .log-connected { color: var(--ok); }
      .log-state { color: var(--text); }
      .log-keepalive-error, .log-error { color: var(--err); }
      .log-info, .log-disconnected { color: var(--muted); }
      code { color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <h1>Lumix Image Uploader</h1>
      <span class="tag">phase 1 · link prover</span>
      <span class="spacer"></span>
      <span id="badge" class="badge"><span class="dot"></span><span id="badge-text">loading…</span></span>
    </header>

    <main>
      <section class="panel">
        <div class="row">
          <div>
            <div class="tag">camera</div>
            <div id="target" style="font-weight:600">—</div>
          </div>
          <div class="spacer"></div>
          <button id="btn-connect" class="primary">Connect</button>
          <button id="btn-disconnect" disabled>Disconnect</button>
        </div>
        <div class="grid">
          <div class="stat"><div class="k">Mode</div><div class="v" id="s-mode">—</div></div>
          <div class="stat"><div class="k">Battery</div><div class="v" id="s-batt">—</div></div>
          <div class="stat"><div class="k">Capacity</div><div class="v" id="s-cap">—</div></div>
          <div class="stat"><div class="k">Last update</div><div class="v" id="s-updated">—</div></div>
        </div>
      </section>

      <section class="panel">
        <div class="row">
          <h2 style="margin:0">Gallery</h2>
          <span class="spacer"></span>
          <select id="filter" title="Filter by type">
            <option value="all">All</option>
            <option value="jpeg">JPG only</option>
            <option value="raw">RAW only</option>
          </select>
          <button id="btn-photos" disabled>Load photos</button>
          <button id="btn-refresh" disabled title="Re-browse the card">Refresh</button>
        </div>
        <div id="gallery-status" class="muted" style="margin-top:10px">Connect to browse the card.</div>
        <div id="gallery"></div>
      </section>

      <section class="panel">
        <h2>Live log</h2>
        <div id="log"></div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const badge = $("badge"), badgeText = $("badge-text"), log = $("log");
      const btnConnect = $("btn-connect"), btnDisconnect = $("btn-disconnect");
      const btnPhotos = $("btn-photos"), btnRefresh = $("btn-refresh");
      const filter = $("filter"), gallery = $("gallery"), galleryStatus = $("gallery-status");
      let allPhotos = [];

      function setBadge(stateClass, text) {
        badge.className = "badge " + stateClass;
        badgeText.textContent = text;
      }
      function setConnected(connected) {
        btnConnect.disabled = connected;
        btnDisconnect.disabled = !connected;
        btnPhotos.disabled = !connected;
        btnRefresh.disabled = !connected;
        setBadge(connected ? "connected" : "", connected ? "connected" : "not connected");
        if (!connected) {
          allPhotos = [];
          gallery.innerHTML = "";
          galleryStatus.textContent = "Connect to browse the card.";
        }
      }
      function shortTime(iso) {
        try { return new Date(iso).toISOString().slice(11, 19); } catch { return iso; }
      }
      function addLog(ev) {
        const text = ev.type === "state" ? formatState(ev.state) : (ev.message ?? ev.type);
        const line = document.createElement("div");
        line.className = "log-line";
        line.innerHTML =
          '<span class="log-time">' + shortTime(ev.time) + "</span>" +
          '<span class="log-' + ev.type + '">' + escapeHtml(text) + "</span>";
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
        while (log.childElementCount > 500) log.removeChild(log.firstChild);
      }
      function escapeHtml(s) {
        return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      }
      function formatState(s) {
        if (!s) return "(no state)";
        const parts = [];
        if (s.cammode) parts.push("mode=" + s.cammode);
        if (s.batt) parts.push("batt=" + s.batt);
        if (s.remaincapacity) parts.push("cap=" + s.remaincapacity);
        if (!parts.length && s.raw) return Object.entries(s.raw).slice(0, 6).map(([k, v]) => k + "=" + v).join(" ");
        return "keep-alive — " + parts.join(" ");
      }
      function applyState(s) {
        $("s-mode").textContent = (s && s.cammode) || "—";
        $("s-batt").textContent = (s && s.batt) || "—";
        $("s-cap").textContent = (s && s.remaincapacity) || "—";
        $("s-updated").textContent = new Date().toISOString().slice(11, 19);
      }

      async function refreshStatus() {
        try {
          const r = await fetch("/api/status");
          const s = await r.json();
          $("target").textContent = s.target;
          setConnected(s.connected);
          if (s.lastState) applyState(s.lastState);
        } catch (e) {
          setBadge("error", "agent unreachable");
        }
      }

      btnConnect.addEventListener("click", async () => {
        setBadge("connecting", "connecting…");
        btnConnect.disabled = true;
        try {
          const r = await fetch("/api/connect", { method: "POST" });
          const body = await r.json();
          if (!r.ok) {
            setBadge("error", "connect failed");
            addLog({ type: "error", time: new Date().toISOString(), message: (body.error || "connect failed") + (body.hint ? " — " + body.hint : "") });
            btnConnect.disabled = false;
            return;
          }
          setConnected(true);
        } catch (e) {
          setBadge("error", "connect failed");
          btnConnect.disabled = false;
        }
      });

      btnDisconnect.addEventListener("click", async () => {
        btnDisconnect.disabled = true;
        await fetch("/api/disconnect", { method: "POST" });
        setConnected(false);
        applyState(null);
      });

      // --- Gallery -----------------------------------------------------------
      function renderPhotos() {
        const f = filter.value;
        const list = allPhotos.filter((p) =>
          f === "raw" ? p.hasRaw : f === "jpeg" ? p.hasJpeg && !p.hasRaw : true,
        );
        galleryStatus.textContent = list.length
          ? `Showing ${list.length} of ${allPhotos.length} photo${allPhotos.length === 1 ? "" : "s"}.`
          : allPhotos.length
            ? "No photos match this filter."
            : "No photos on the card.";
        gallery.innerHTML = list.map(cardHtml).join("");
      }
      function cardHtml(p) {
        const thumb = p.thumb
          ? `<div class="thumb"><img loading="lazy" src="${p.thumb}" alt=""></div>`
          : `<div class="thumb empty"></div>`;
        const badges =
          (p.hasRaw ? '<span class="b raw">RAW</span>' : "") +
          (p.hasJpeg ? '<span class="b jpg">JPG</span>' : "");
        const actions =
          (p.jpeg ? `<a href="${p.jpeg}" target="_blank" rel="noopener">JPG</a>` : "") +
          (p.raw ? `<a href="${p.raw}">RW2</a>` : "");
        return (
          `<div class="card">${thumb}` +
          `<div class="card-meta"><span class="name" title="${esc(p.title)}">${esc(p.title)}</span>${badges}</div>` +
          (actions ? `<div class="card-actions">${actions}</div>` : "") +
          `</div>`
        );
      }
      function esc(s) {
        return escapeHtml(s);
      }
      async function loadPhotos(refresh) {
        btnPhotos.disabled = true;
        btnRefresh.disabled = true;
        galleryStatus.textContent = refresh ? "Re-browsing the card…" : "Browsing the card…";
        try {
          const r = await fetch("/api/photos" + (refresh ? "?refresh=1" : ""));
          const body = await r.json();
          if (!r.ok) {
            galleryStatus.textContent = "Browse failed: " + (body.error || r.status);
            return;
          }
          allPhotos = body.photos;
          renderPhotos();
        } catch (e) {
          galleryStatus.textContent = "Browse failed: " + e.message;
        } finally {
          btnPhotos.disabled = false;
          btnRefresh.disabled = false;
        }
      }
      btnPhotos.addEventListener("click", () => loadPhotos(false));
      btnRefresh.addEventListener("click", () => loadPhotos(true));
      filter.addEventListener("change", renderPhotos);

      // Live updates via Server-Sent Events.
      const es = new EventSource("/api/events");
      es.onmessage = (e) => {
        const ev = JSON.parse(e.data);
        addLog(ev);
        if (ev.type === "connected") setConnected(true);
        if (ev.type === "disconnected") { setConnected(false); applyState(null); }
        if (ev.type === "state" && ev.state) applyState(ev.state);
      };
      es.onerror = () => setBadge("error", "event stream lost");

      refreshStatus();
    </script>
  </body>
</html>
